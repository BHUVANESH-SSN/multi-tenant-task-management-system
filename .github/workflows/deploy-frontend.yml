name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 44.199.231.18
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.FRONTEND_EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT }}
          script: |
            set -e
            cd /home/ubuntu
            docker compose down
            docker compose up -d --build
